# Проверка и выкат сэндбокса.
#
# Сборка проверяется здесь, в GitHub, а выкатывает сама сборка — токеном,
# который платформа выдала на один-единственный проект Railway и может
# отозвать. Доступа к остальному вашему хостингу у репозитория нет.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Сам шаблон — не сэндбокс: выкатывать ему некуда.
    if: github.event.repository.is_template == false
    # Секрет виден условиям только через env: контекст secrets в `if` не
    # разрешён, и workflow с ним даже не запускается.
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Установить зависимости
        run: |
          corepack enable
          pnpm install --frozen-lockfile || pnpm install

      # Ломается здесь — значит выкатывать нечего, и это видно за минуту.
      - name: Собрать
        run: pnpm build

      - name: Выкатить
        if: env.RAILWAY_TOKEN != ''
        env:
          SERVICE: ${{ vars.RAILWAY_SERVICE }}
          ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          railway up --service "$SERVICE" --environment "$ENVIRONMENT" --ci

      - name: Сообщить, что хостинг ещё не подключён
        if: env.RAILWAY_TOKEN == ''
        run: echo "::notice::Сборка прошла. Подключите хостинг в zerotomvp, чтобы её выкатить."
