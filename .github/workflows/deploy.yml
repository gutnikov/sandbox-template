# Сборка и публикация образа сэндбокса.
#
# Образ живёт в реестре пакетов этого же репозитория, то есть в вашем
# аккаунте. Для публикации хватает удостоверения, которое GitHub выдаёт
# самому запуску: отдельный токен реестра заводить не нужно.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Секрет виден условиям только через env: контекст secrets в `if` не
    # разрешён, и workflow с ним даже не запускается.
    env:
      DEPLOY_SECRET: ${{ secrets.ZEROTOMVP_DEPLOY_SECRET }}
    # Сам шаблон — не сэндбокс: записи о нём в платформе нет, публиковать
    # ему нечего. В порождённых репозиториях условие истинно.
    if: github.event.repository.is_template == false
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Войти в реестр пакетов
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя образа в ghcr.io должно быть в нижнем регистре, а логин на
      # GitHub — не обязательно.
      - name: Определить имя образа
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Собрать и опубликовать образ
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Выкатывает платформа: у неё есть доступ к вашему хостингу, а у
      # репозитория — только этот односторонний секрет, который платформа
      # выдала и может отозвать.
      - name: Попросить платформу выкатить образ
        if: env.DEPLOY_SECRET != ''
        env:
          ENDPOINT: ${{ vars.ZEROTOMVP_DEPLOY_URL || 'https://zerotomvp.xyz/api/hooks/deploy' }}
          SECRET: ${{ secrets.ZEROTOMVP_DEPLOY_SECRET }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --max-time 30 --retry 3 --retry-connrefused \
            -X POST "$ENDPOINT" \
            -H "authorization: Bearer $SECRET" \
            -H "content-type: application/json" \
            -d "{\"image\":\"$IMAGE\",\"digest\":\"$DIGEST\",\"commit\":\"$COMMIT\"}"

      - name: Сообщить, что хостинг ещё не подключён
        if: env.DEPLOY_SECRET == ''
        run: echo "::notice::Образ опубликован. Подключите хостинг в zerotomvp, чтобы его выкатить."
